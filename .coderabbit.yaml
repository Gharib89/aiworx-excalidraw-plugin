# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Path instructions derive from the canonical standards doc, CLAUDE.md —
# rule changes land there first, then re-derive here.

tone_instructions: >-
  Direct and concise; no praise, no restating the diff. Comment only when
  confident an issue is real, citing the exact line. Prioritize correctness,
  error contracts, and cross-platform safety over style.

reviews:
  # chill (balanced): CodeRabbit owns review iteration until convergence, so a
  # quieter profile would under-serve the reviewer that carries the load.
  profile: chill
  path_filters:
    # Committed build output (fingerprint-stamped bundle + vendored fonts) —
    # regenerated by `npm run bundle`, never hand-edited.
    - "!dist/**"
    # Generated by the example generators; correcting one means re-running
    # the generator, not editing the artifact.
    - "!examples/**/*.excalidraw"
    - "!examples/**/*.svg"
  auto_review:
    # Defaults, spelled out because the review policy depends on them:
    # /ship opens ready (non-draft) PRs, and the until-converge loop relies
    # on an incremental re-review landing after every push.
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_instructions:
    - path: "**"
      instructions: >-
        Claude Code plugin for authoring .excalidraw diagrams with measured
        text and headless visual verification. Canonical standards live in
        CLAUDE.md; these instructions derive from it and it wins on conflict.
        Plain Node >=18 ESM with no build step for consumers, no TypeScript,
        no linter, no formatter — never request adding them; the test suite,
        the clean-tree check, and bundle reproducibility are the whole CI
        gate. Do not flag issues those checks catch, and skip stylistic
        nits. Verify every dependency-related nit against the pinned
        lockfile versions before flagging. dist/ is committed by design
        (fingerprint-stamped bundle + vendored fonts) — never suggest
        gitignoring it; a change to a bundle input (tools/page.js,
        tools/bundle.js, tools/fonts.js, or a lockfile-resolved version of
        @excalidraw/excalidraw, react, react-dom, esbuild) must ship the
        rebuilt dist/ in the same PR, and any new dist/ path needs its own
        un-ignore line in .gitignore. A new test suite must be wired into
        exactly one of test:fast or test:browser (tests/test-targets.js
        enforces this), and test:fast must stay Chrome-free. Every
        user-visible change ships its docs in the same PR (README.md, the
        shipped skill, CONTEXT.md for term renames). This repo keeps no
        CHANGELOG — history lives in Conventional-Commit squash subjects;
        never request one.
    - path: "skills/excalidraw-diagram/**"
      instructions: >-
        The shipped skill: it travels to plugin users who do not have this
        repo, so it must stay self-contained. Flag any link or path
        reference that points outside skills/, and any instruction that
        assumes a repo checkout. Terse imperative agent-facing style is
        intentional — do not request prose softening or docstring-like
        expansion.
