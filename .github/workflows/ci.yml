name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push supersedes the run it just made obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Browser discovery and path handling are per-OS claims (the "chrome"
    # channel on macOS/Windows, junction links, file-URL module specifiers) —
    # run the suite where those claims live, not just on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runtime deps only (playwright-core), exactly as locked; the browser
      # bundle is committed and the smoke suite drives the runner's
      # preinstalled system Chrome.
      - run: npm ci --omit=dev
      - run: npm test
      - name: verification must not dirty the repo
        shell: bash
        run: test -z "$(git status --porcelain)"

  bundle:
    # The committed bundle is what ships, but `npm run bundle` must stay able
    # to reproduce it: rebuild from the locked toolchain, then run the
    # capability gate and the check CLI against the freshly built bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      # The fingerprint certifies the hashed inputs, not the bytes: a floating
      # transitive dep (mermaid, d3) can move the real bundle while the stamp
      # stays green. Compare bytes AND paths — `git diff` alone misses an added
      # file (a content-hashed woff2 renamed by a dep bump, or a new dist/ path
      # that .gitignore's by-name un-ignores would silently drop).
      - name: rebuilt bundle must match the committed dist/
        run: |
          git diff --stat --exit-code dist/
          test -z "$(git status --porcelain --ignored dist/)" \
            || { git status --porcelain --ignored dist/; exit 1; }
      - run: npm run smoke
      - run: node tools/check.js tests/fixtures/clean.excalidraw
