name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push supersedes the run it just made obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Browser discovery and path handling are per-OS claims (the "chrome"
    # channel on macOS/Windows, junction links, file-URL module specifiers) —
    # run the suite where those claims live, not just on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runtime deps only (playwright-core), exactly as locked; the browser
      # bundle is committed and the smoke suite drives the runner's
      # preinstalled system Chrome.
      - run: npm ci --omit=dev
      - run: npm test
      - name: verification must not dirty the repo
        shell: bash
        run: test -z "$(git status --porcelain)"

  plugin:
    # What ships to an install, and whether an install would ever see it. Both
    # checks read manifests, so they are OS-independent — a 3-OS matrix here
    # would buy three identical answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base ref's merge base, which a shallow
          # clone does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # An installed plugin is a cached copy that refreshes when the version
      # moves: plugin content merged under the version an install already has
      # never reaches it. PR-only — the gate compares two refs.
      #
      # Both SHAs are named explicitly. A pull_request checkout is the *merge*
      # commit, which already carries whatever landed on the base branch since
      # the fork point; diffing from it would blame this PR for those files and
      # demand a bump it does not owe.
      - name: plugin content requires a version bump
        if: github.event_name == 'pull_request'
        run: >-
          node tools/version-gate.js
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
      # Pinned: an unpinned CLI would let a release of Claude Code turn this
      # leg red without a change here.
      - run: npm i -g @anthropic-ai/claude-code@2.1.245
      - run: claude plugin validate . --strict

  bundle:
    # The committed bundle is what ships, but `npm run bundle` must stay able
    # to reproduce it: rebuild from the locked toolchain, then run the
    # capability gate and the check CLI against the freshly built bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      # The fingerprint certifies the hashed inputs, not the bytes: a floating
      # transitive dep (mermaid, d3) can move the real bundle while the stamp
      # stays green. Compare bytes AND paths — `git diff` alone misses an added
      # file (a content-hashed woff2 renamed by a dep bump, or a new dist/ path
      # that .gitignore's by-name un-ignores would silently drop).
      - name: rebuilt bundle must match the committed dist/
        run: |
          git diff --stat --exit-code dist/
          test -z "$(git status --porcelain --ignored dist/)" \
            || { git status --porcelain --ignored dist/; exit 1; }
      - run: npm run smoke
      - run: node tools/check.js tests/fixtures/clean.excalidraw
